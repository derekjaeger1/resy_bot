<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sniper">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/app.css?v=20261113-ot1">
  <title>{% block title %}Reservation Sniper{% endblock %}</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a href="/" class="brand"><i>◎</i>Reservation Sniper</a>
      <span class="subtle" style="font-size:12px">ET</span>
    </header>
    {% if message %}<div class="flash ok">{{ message }}</div>{% endif %}
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <nav class="nav">
    <div class="navin">
      <a href="/" class="{% if page=='home' %}active{% endif %}"><strong>⌂</strong>Home</a>
      <a href="/new" class="{% if page=='new' %}active{% endif %}"><strong>＋</strong>Watch</a>
      <a href="/settings" class="{% if page=='settings' %}active{% endif %}"><strong>⚙</strong>Settings</a>
    </div>
  </nav>
  <script src="/static/app.js?v=20261113-ot1"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
