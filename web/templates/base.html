<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Resy Bot{% endblock %}</title>
    <!-- Favicon: Target/crosshair icon in resy brand colors -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ed8778'/%3E%3Cstop offset='100%25' stop-color='%23cd4331'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='white' stroke-width='2'/%3E%3Cline x1='16' y1='2' x2='16' y2='8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='16' y1='24' x2='16' y2='30' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='2' y1='16' x2='8' y2='16' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='24' y1='16' x2='30' y2='16' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2' fill='white'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'resy': {
                            50: '#fdf4f3',
                            100: '#fce7e4',
                            200: '#fad3cd',
                            300: '#f5b4aa',
                            400: '#ed8778',
                            500: '#e15f4d',
                            600: '#cd4331',
                            700: '#ac3526',
                            800: '#8e2f23',
                            900: '#762c23',
                            950: '#40130e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="h-full gradient-bg text-white">
    <div class="min-h-full">
        <!-- Navigation -->
        <nav class="border-b border-white/10">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 flex items-center gap-2">
                            <!-- Logo Icon -->
                            <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <defs>
                                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#ed8778"/>
                                        <stop offset="100%" stop-color="#cd4331"/>
                                    </linearGradient>
                                </defs>
                                <circle cx="16" cy="16" r="14" fill="url(#logoGrad)"/>
                                <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="2"/>
                                <circle cx="16" cy="16" r="5" fill="none" stroke="white" stroke-width="2"/>
                                <line x1="16" y1="2" x2="16" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
                                <line x1="16" y1="24" x2="16" y2="30" stroke="white" stroke-width="2" stroke-linecap="round"/>
                                <line x1="2" y1="16" x2="8" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
                                <line x1="24" y1="16" x2="30" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="16" cy="16" r="2" fill="white"/>
                            </svg>
                            <span class="text-2xl font-bold bg-gradient-to-r from-resy-400 to-resy-600 bg-clip-text text-transparent">
                                Resy Bot
                            </span>
                        </div>
                        <div class="ml-6 flex items-baseline space-x-1">
                            <a href="/" class="{% if page == 'dashboard' %}bg-white/10 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %} rounded-lg px-2 py-2 text-sm font-medium transition-all">
                                Dashboard
                            </a>
                            <a href="/restaurants" class="{% if page == 'restaurants' %}bg-white/10 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %} rounded-lg px-2 py-2 text-sm font-medium transition-all">
                                Restaurants
                            </a>
                            <a href="/reservations" class="{% if page == 'reservations' %}bg-white/10 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %} rounded-lg px-2 py-2 text-sm font-medium transition-all">
                                Schedule
                            </a>
                            <a href="/monitors" class="{% if page == 'monitors' %}bg-white/10 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %} rounded-lg px-2 py-2 text-sm font-medium transition-all">
                                Monitors
                            </a>
                            <a href="/availability" class="{% if page == 'availability' %}bg-white/10 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %} rounded-lg px-2 py-2 text-sm font-medium transition-all">
                                Availability
                            </a>
                            <a href="/my-reservations" class="{% if page == 'my-reservations' %}bg-white/10 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %} rounded-lg px-2 py-2 text-sm font-medium transition-all">
                                My Resos
                            </a>
                            <a href="/logs" class="{% if page == 'logs' %}bg-white/10 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %} rounded-lg px-2 py-2 text-sm font-medium transition-all">
                                Logs
                            </a>
                            <a href="/settings" class="{% if page == 'settings' %}bg-white/10 text-white{% else %}text-gray-300 hover:bg-white/5 hover:text-white{% endif %} rounded-lg px-2 py-2 text-sm font-medium transition-all">
                                Settings
                            </a>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        {% block header_actions %}{% endblock %}
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main content -->
        <main>
            <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
